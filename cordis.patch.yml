# dsh-a2a bundle patch — self-mounting bundle layer.
# Profile list `@ryubyte/dsh-a2a` in dsh.profile.bundles (via
# `dsh plugin --profile <profile> add @ryubyte/dsh-a2a`); no manual
# cordis.patch.yml entry needed. `id` stays stable so user overlays can
# toggle it; `name` is the published package name and must match
# package.json. Runtime config (mode, agents, server) lives in the
# profile's a2a.json:
#   - mode: client | server | both  (default client — server off unless enabled)
#   - server: { enabled: true, ... } explicitly turns the inbound server on.
- insert:
    - id: a2a
      name: '@ryubyte/dsh-a2a'
